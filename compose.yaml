name: documind
services:
  db:
    image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: documind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup}
      DOCUMIND_DB_PASSWORD: ${DOCUMIND_DB_PASSWORD:?Run npm run setup}
    ports: ["127.0.0.1:55433:5432"]
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d documind"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m
  store:
    image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    environment:
      S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY:?Run npm run setup}
      S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY:?Run npm run setup}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Run npm run setup}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Run npm run setup}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        printf '{"identities":[{"name":"bootstrap","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List"]},{"name":"runtime","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read:documind-local","Write:documind-local","List:documind-local"]}]}' "$$S3_ADMIN_ACCESS_KEY" "$$S3_ADMIN_SECRET_KEY" "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        printf '[leveldb2]\nenabled = true\ndir = "/data/filer"\n' > /etc/seaweedfs/filer.toml
        exec weed server -s3 -s3.config=/tmp/s3.json -dir=/data -ip=store -ip.bind=0.0.0.0 -volume.max=8 -master.volumeSizeLimitMB=64
    ports: ["127.0.0.1:58333:8333"]
    volumes:
      - objects:/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:9333/dir/status | grep -q '"Url":"store:8080"'
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    stop_grace_period: 30s
    mem_limit: 768m
volumes:
  database:
  objects:
